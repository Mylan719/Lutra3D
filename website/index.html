<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lutra 3D — a gallery of 3D printing projects and upcoming commissions.">
  <title>Gallery · Lutra 3D</title>
  <link rel="icon" href="assets/brand/symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header container">
    <a class="brand" href="#/gallery" aria-label="Lutra 3D — Gallery"><picture class="brand-logo"><source media="(min-width: 600px)" srcset="assets/brand/logo-horizontal.svg"><img src="assets/brand/logo.svg" width="380" height="380" alt="Lutra 3D"></picture><span class="brand-copy"><span class="brand-name">Lutra 3D</span><span class="brand-tagline">Things I make</span></span></a>
    <nav aria-label="Main navigation"><a href="#/gallery" data-nav="gallery">Gallery</a><a href="#/queue" data-nav="queue">Queue</a></nav>
  </header>
  <main id="main-content" class="container" tabindex="-1"></main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <noscript><p class="container">JavaScript is needed to display the gallery, project details, and queue.</p></noscript>
  <footer class="container site-footer"><img class="footer-logo" src="assets/brand/symbol.svg" width="32" height="32" alt="">Lutra 3D · Protogens, Props, Mechanical parts</footer>
  <template id="gallery-view"><section><div class="view-heading"><p class="eyebrow">Ideas made tangible</p><h1 tabindex="-1">Gallery</h1><p>Explore our designs, one project at a time.</p></div><p class="notice" data-notice hidden></p><ul class="card-grid" data-list aria-label="Projects"></ul><div data-empty></div></section></template>
  <template id="project-card"><li><article class="project-card"><a class="project-link"><div class="project-titlebar"><span class="pixel-folder" aria-hidden="true"></span><h2></h2><span class="pixel-spark" aria-hidden="true"></span></div><div class="collage"></div></a><ul class="resource-links" aria-label="Project resources" hidden></ul></article></li></template>
  <template id="photo"><figure class="photo"><img decoding="async"><figcaption hidden>Photo unavailable</figcaption></figure></template>
  <template id="project-view"><article><a class="back-link" href="#/gallery">← Back to Gallery</a><div class="view-heading"><p class="eyebrow">A Lutra 3D project</p><h1 tabindex="-1"></h1><ul class="resource-links" aria-label="Project resources" hidden></ul></div><p class="description"></p><div class="detail-photos"></div></article></template>
  <template id="resource-link"><li><a class="resource-badge"><img width="18" height="18" alt="" aria-hidden="true"><span></span></a></li></template>
  <template id="queue-view"><section><div class="view-heading"><p class="eyebrow">On the workbench</p><h1 tabindex="-1">Queue</h1><p>Upcoming jobs, with the newest commissions first. This order does not indicate execution priority.</p></div><p class="notice" data-notice hidden></p><ul class="card-grid" data-list aria-label="Upcoming jobs"></ul><div data-empty></div></section></template>
  <template id="queue-card"><li class="queue-card"><div class="queue-titlebar"><span class="pixel-folder" aria-hidden="true"></span><h2></h2><span class="pixel-spark" aria-hidden="true"></span></div><dl><div><dt>Customer</dt><dd data-customer></dd></div><div><dt>Date commissioned</dt><dd><time></time></dd></div></dl></li></template>
  <template id="message-view"><section class="message-view"><h1 tabindex="-1"></h1><p data-message></p><button type="button" hidden>Retry</button><a href="#/gallery" hidden>Back to Gallery</a></section></template>
</body>
</html>
